# Author: Marko Schrempf
name: Git Time Calculator

on:
  workflow_dispatch:

jobs:
  calculate-time:
    runs-on: ubuntu-latest

    env:
      TIME_CALCULATOR_PATH: Diplomarbeit/da-base-template/tools/time/time-calculator.py

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set Up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Calculate User Time
      id: user_time
      run: |
        FILE=$(python $TIME_CALCULATOR_PATH -u -a -ef "" | grep 'Exported report' | awk '{print $4}')
        echo "user_time_file=$FILE" >> $GITHUB_OUTPUT
        
    - name: Calculate Issue Time
      id: issue_time
      run: |
        FILE=$(python $TIME_CALCULATOR_PATH -i -a -ef "" | grep 'Exported report' | awk '{print $4}')
        echo "issue_time_file=$FILE" >> $GITHUB_OUTPUT

    - name: Upload User Time
      uses: actions/upload-artifact@v4
      with:
        name: user-time-report
        path: ${{ steps.user_time.outputs.user_time_file }}

    - name: Upload Issue Time
      uses: actions/upload-artifact@v4
      with:
        name: issue-time-report
        path: ${{ steps.issue_time.outputs.issue_time_file }}
