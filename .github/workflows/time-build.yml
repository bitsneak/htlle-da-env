name: Build Time Reporter

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --onefile time-calculator.py

      - name: Rename executable for release
        run: |
          mkdir output
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            mv dist/time-calculator.exe output/time-calculator-wnt64.exe
          elif [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            mv dist/time-calculator output/time-calculator-ln64
          else
            mv dist/time-calculator output/time-calculator-mac64
          fi

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
