name: Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [closed]

permissions:
  contents: write

jobs:
  changelog:
    name: Changelog
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    outputs:
      skipped: ${{ steps.changelog.outputs.skipped }}
      tag: ${{ steps.changelog.outputs.tag }}
      clean_changelog: ${{ steps.changelog.outputs.clean_changelog }}
      version: ${{ steps.changelog.outputs.version }}
      previous_tag: ${{ steps.get_previous_tag.outputs.previous_tag }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Changelog
        uses: TriPSs/conventional-changelog-action@v6
        id: changelog
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          git-user-name: "github-actions[bot]"
          git-user-email: "github-actions[bot]@users.noreply.github.com"
          skip-git-pull: true
          skip-on-empty: true
          preset: conventionalcommits
          input-file: CHANGELOG.md
          output-file: CHANGELOG.md
          version-file: .github/version-info.yml

      - name: Get Previous Tag
        id: get_previous_tag
        run: |
          TAGS=$(git tag --sort=-version:refname)
          PREVIOUS_TAG=$(echo "$TAGS" | sed -n '2p')
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "previous_tag=" >> $GITHUB_OUTPUT
          else
            echo "previous_tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build Executables
    needs: [changelog]
    if: needs.changelog.outputs.skipped == 'false'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            executable_name: time-reporter-ln64
            platform: linux
          - os: macos-latest
            executable_name: time-reporter-mac64
            platform: macos
          - os: windows-latest
            executable_name: time-reporter-wn64.exe
            platform: windows
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: Install PyInstaller
        run: pip install pyinstaller
      
      - name: Build Executable
        run: pyinstaller --onefile --name ${{ matrix.executable_name }} tools/time/time-reporter.py
      
      - name: Upload Executable
        uses: actions/upload-artifact@v4
        with:
          name: executable-${{ matrix.platform }}
          path: dist/${{ matrix.executable_name }}

  package:
    name: Package Release
    needs: [changelog, build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Download Executables
        uses: actions/download-artifact@v4
        with:
          path: executables
      
      - name: Prepare release directory
        run: |
          mkdir -p release/time-reporter
          cp LICENSE release/time-reporter/
          cp tools/time/README.md release/time-reporter/
          cp tools/time/time-reporter.py release/time-reporter/
          cp executables/executable-linux/time-reporter-ln64 release/time-reporter/
          cp executables/executable-macos/time-reporter-mac64 release/time-reporter/
          cp executables/executable-windows/time-reporter-wn64.exe release/time-reporter/
          chmod +x release/time-reporter/time-reporter-ln64
          chmod +x release/time-reporter/time-reporter-mac64
      
      - name: Create ZIP Archive
        run: |
          cd release
          zip -r ../time-reporter.zip time-reporter

      - name: Create TAR.GZ Archive
        run: |
          cd release
          tar -czf ../time-reporter.tar.gz time-reporter

      - name: Upload Archives
        uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: |
            time-reporter.zip
            time-reporter.tar.gz

  release:
    name: Release
    needs: [changelog, package]
    if: needs.changelog.outputs.skipped == 'false'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Release Archives
        uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: ./

      - name: Get Contributors
        id: contributors
        run: |
          if [ -n "${{ needs.changelog.outputs.previous_tag }}" ]; then
            CONTRIBUTORS=$(git log ${{ needs.changelog.outputs.previous_tag }}..${{ needs.changelog.outputs.tag }} --format='%ae|%an' | sort -u)
          else
            CONTRIBUTORS=$(git log ${{ needs.changelog.outputs.tag }} --format='%ae|%an' | sort -u)
          fi
          
          # Extract unique GitHub usernames from commit authors
          USERNAMES=""
          while IFS='|' read -r email name; do
            # Try to extract GitHub username from email
            if [[ $email == *"@users.noreply.github.com" ]]; then
              USERNAME=$(echo $email | sed 's/@users.noreply.github.com//' | sed 's/^[0-9]*+//')
              USERNAMES="$USERNAMES @$USERNAME"
            elif [[ $email == *"[bot]@"* ]]; then
              USERNAME=$(echo $email | sed 's/@.*//')
              USERNAMES="$USERNAMES @$USERNAME"
            fi
          done <<< "$CONTRIBUTORS"
          
          # Remove duplicates and format
          USERNAMES=$(echo $USERNAMES | tr ' ' '\n' | sort -u | tr '\n' ' ' | sed 's/ $//' | sed 's/ / and /g')
          
          # Fallback to names if no usernames found
          if [ -z "$USERNAMES" ]; then
            USERNAMES=$(echo "$CONTRIBUTORS" | cut -d'|' -f2 | sort -u | paste -sd " and " -)
          fi
          
          echo "contributors=$USERNAMES" >> $GITHUB_OUTPUT

      - name: Create Release Body
        id: release_body
        run: |
          CHANGELOG="${{ needs.changelog.outputs.clean_changelog }}"
          
          if [ -n "${{ needs.changelog.outputs.previous_tag }}" ]; then
            FULL_CHANGELOG="**Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ needs.changelog.outputs.previous_tag }}...${{ needs.changelog.outputs.tag }}"
          else
            FULL_CHANGELOG="**Full Changelog**: https://github.com/${{ github.repository }}/commits/${{ needs.changelog.outputs.tag }}"
          fi
          
          CONTRIBUTORS="${{ steps.contributors.outputs.contributors }}"
          
          BODY=$(cat <<EOF
          ${CHANGELOG}

          ${FULL_CHANGELOG}
          EOF
          )
          
          # Only add contributors section if there are contributors
          if [ -n "$CONTRIBUTORS" ]; then
            BODY=$(cat <<EOF
          ${BODY}

          **Contributors**: ${CONTRIBUTORS}
          EOF
          )
          fi
          
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        with:
          tag_name: ${{ needs.changelog.outputs.tag }}
          name: ${{ needs.changelog.outputs.tag }}
          body: ${{ steps.release_body.outputs.body }}
          files: |
            time-reporter.zip
            time-reporter.tar.gz
