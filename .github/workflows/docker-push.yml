# Author: Marko Schrempf
name: Push Docker Image

on:
#  workflow_run:
#    workflows: ["Build Docker Image"] 
#    types:
#      - completed
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  push:
    #if: ${{ github.event.workflow_run.conclusion == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - uses: actions-ecosystem/action-get-latest-tag@v1
        id: get-latest-tag

      #- name: Docker Hub Login
        #uses: docker/login-action@v4
        #with:
          #username: ${{ secrets.DOCKERHUB_USERNAME }}
          #password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: GHCR Login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v4

            # ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}:latest
            # ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}:${{ steps.get-latest-tag.outputs.tag }}

      - name: Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: tools/docker
          platforms: linux/amd64,linux/arm/v7,linux/arm64/v8
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ secrets.DOCKERHUB_REPOSITORY }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ secrets.DOCKERHUB_REPOSITORY }}:${{ steps.get-latest-tag.outputs.tag }}
